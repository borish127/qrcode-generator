<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e72c7" />
      <stop offset="100%" stop-color="#284892" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d8e2ff" />
    </linearGradient>
  </defs>
  <!-- App Container (MD3 shape) -->
  <rect width="64" height="64" rx="16" fill="url(#primaryGrad)" />
  
  <!-- Top Left Corner Finder Pattern -->
  <rect x="10" y="10" width="18" height="18" rx="5" fill="#ffffff" />
  <rect x="14" y="14" width="10" height="10" rx="3" fill="#3a5ba9" />
  <rect x="16.5" y="16.5" width="5" height="5" rx="1.5" fill="#ffffff" />
  
  <!-- Top Right Corner Finder Pattern -->
  <rect x="36" y="10" width="18" height="18" rx="5" fill="#ffffff" />
  <rect x="40" y="14" width="10" height="10" rx="3" fill="#3a5ba9" />
  <rect x="42.5" y="16.5" width="5" height="5" rx="1.5" fill="#ffffff" />
  
  <!-- Bottom Left Corner Finder Pattern -->
  <rect x="10" y="36" width="18" height="18" rx="5" fill="#ffffff" />
  <rect x="14" y="40" width="10" height="10" rx="3" fill="#3a5ba9" />
  <rect x="16.5" y="42.5" width="5" height="5" rx="1.5" fill="#ffffff" />
  
  <!-- Timing and Data Modules -->
  <rect x="36" y="36" width="6" height="6" rx="2" fill="url(#innerGrad)" />
  <rect x="48" y="36" width="6" height="6" rx="2" fill="url(#innerGrad)" />
  <rect x="42" y="42" width="6" height="6" rx="2" fill="url(#innerGrad)" />
  <rect x="36" y="48" width="6" height="6" rx="2" fill="url(#innerGrad)" />
  <rect x="48" y="48" width="6" height="6" rx="2" fill="url(#innerGrad)" />
</svg>
